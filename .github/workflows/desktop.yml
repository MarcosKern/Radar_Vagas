name: Windows desktop
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s tests
      - run: python desktop/build.py --exe dist/Radar_de_Vagas.exe
      - name: Abrir executável e verificar servidor
        shell: pwsh
        run: |
          $app = Start-Process dist/Radar_de_Vagas.exe -PassThru
          try {
            $health = $null
            for ($i = 0; $i -lt 45; $i++) {
              if ($app.HasExited) { throw "Executável encerrou antes da inicialização." }
              try { $health = Invoke-RestMethod http://127.0.0.1:8765/api/updates/health -TimeoutSec 1 } catch {}
              if ($health.app -eq 'Radar_Vagas') { break }
              Start-Sleep -Seconds 1
            }
            $manifest = Get-Content desktop-release.json -Raw | ConvertFrom-Json
            if ($health.version -ne $manifest.version) { throw "Versão incorreta ou servidor indisponível." }
            $state = Invoke-RestMethod http://127.0.0.1:8765/api/state
            if ($state.jobs.Count -ne 0) { throw "Instalação com dados inesperados." }
          } finally {
            if (!$app.HasExited) { taskkill /PID $app.Id /T /F }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Radar_de_Vagas_Windows_x64
          path: dist/Radar_de_Vagas.exe
